services:
  - type: web
    name: pizza-pronto-italiana
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && npm ci && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: python -m backend.serve
    healthCheckPath: /api/health
    disk:
      name: pizza-pronto-datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: NODE_VERSION
        value: "24.22.1"
      - key: PIZZA_PRONTO_ENV
        value: production
      - key: PIZZA_PRONTO_SECRET_KEY
        generateValue: true
      - key: PIZZA_PRONTO_ADMIN_PASSWORD
        sync: false
      - key: PIZZA_PRONTO_COCINA_PASSWORD
        sync: false
      - key: PIZZA_PRONTO_CAJA_PASSWORD
        sync: false
      - key: PIZZA_PRONTO_DATA_DIR
        value: /var/data
      - key: PIZZA_PRONTO_UPLOAD_DIR
        value: /var/data/uploads
